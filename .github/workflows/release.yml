name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.candidate-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve immutable candidate
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python scripts/check_release_candidate.py \
            --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA" \
            --checkout-sha "$(git rev-parse HEAD)"
          echo "candidate-sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check package versions and release tag
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          pyproject_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          cargo_toml = Path("Cargo.toml").read_text()
          cargo_version = re.search(r'^version\s*=\s*"([^"]+)"', cargo_toml, re.MULTILINE)

          if cargo_version is None:
              raise SystemExit("Cargo.toml package version was not found")

          versions = {
              "pyproject.toml": pyproject_version,
              "Cargo.toml": cargo_version.group(1),
          }
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              ref = os.environ["GITHUB_REF"]
              if not ref.startswith("refs/tags/v"):
                  raise SystemExit(f"release workflow must run from a v* tag, got {ref!r}")
              versions["tag"] = ref.removeprefix("refs/tags/v")

          if len(set(versions.values())) != 1:
              raise SystemExit(f"release versions do not match: {versions}")

  full-checks:
    name: Full candidate checks
    needs: validate-version
    uses: ./.github/workflows/full_checks.yml
    with:
      candidate-sha: ${{ needs.validate-version.outputs.candidate-sha }}

  linux-wheels:
    name: Build Linux wheel (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate-version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Set up QEMU
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64' && '-D__ARM_ARCH=8' || '' }}
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python3.11
          manylinux: "2014"
          sccache: true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  linux-wheel-smoke:
    name: Smoke Linux wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [validate-version, linux-wheels]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Download x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Smoke test wheel install
        run: python -I -S scripts/install_wheel_smoke.py --dist-dir dist

  macos-wheels:
    name: Build macOS wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: validate-version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            runner: macos-15-intel
            target: x86_64
          - name: aarch64
            runner: macos-15
            target: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --interpreter python
          sccache: true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  macos-wheel-smoke:
    name: Smoke macOS wheel (${{ matrix.platform.name }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.platform.runner }}
    needs: [validate-version, macos-wheels]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        platform:
          - name: x86_64
            runner: macos-15-intel
          - name: aarch64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.name }}
          path: dist

      - name: Smoke test wheel install
        run: python -I -S scripts/install_wheel_smoke.py --dist-dir dist

  windows-wheels:
    name: Build Windows wheel (x64)
    runs-on: windows-latest
    needs: validate-version
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --interpreter python
          sccache: true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist/*.whl
          if-no-files-found: error

  windows-wheel-smoke:
    name: Smoke Windows wheel (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    needs: [validate-version, windows-wheels]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

      - name: Smoke test wheel install
        run: python -I -S scripts/install_wheel_smoke.py --dist-dir dist

  audit-wheels:
    name: Audit stable ABI wheels
    runs-on: ubuntu-latest
    needs: [linux-wheels, macos-wheels, windows-wheels]
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install abi3audit
        run: python -m pip install --disable-pip-version-check "abi3audit==0.0.26"

      - name: Audit stable ABI compatibility
        shell: bash
        run: python -m abi3audit --strict --summary dist/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: validate-version
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Record source archive identity
        shell: python
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit("expected exactly one source archive")
          archive = archives[0]
          manifest = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
          }
          Path("sdist-provenance.json").write_text(json.dumps(manifest, indent=2) + "\n")

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Retain source archive identity
        uses: actions/upload-artifact@v4
        with:
          name: sdist-provenance
          path: sdist-provenance.json
          if-no-files-found: error

  sdist-smoke:
    name: Rebuild and smoke the retained source archive
    runs-on: ubuntu-latest
    needs: [validate-version, sdist]
    timeout-minutes: 45
    outputs:
      candidate-sha: ${{ steps.verify.outputs.candidate-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Download source identity
        uses: actions/download-artifact@v4
        with:
          name: sdist-provenance
          path: evidence

      - name: Rebuild and verify source archive
        id: verify
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: |
          python -I -S scripts/check_sdist.py \
            --dist-dir dist --manifest evidence/sdist-provenance.json \
            --candidate-sha "$CANDIDATE_SHA" --receipt sdist-rebuilt.json
          echo "candidate-sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Retain source rebuild evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdist-rebuild-evidence
          path: sdist-rebuilt.json
          if-no-files-found: error

  release-gate:
    name: Verify candidate release evidence
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - full-checks
      - audit-wheels
      - linux-wheel-smoke
      - macos-wheel-smoke
      - windows-wheel-smoke
      - sdist-smoke
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require every release check for this candidate
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
          QUALITY_SHA: ${{ needs.full-checks.outputs.candidate-sha }}
          SDIST_SHA: ${{ needs.sdist-smoke.outputs.candidate-sha }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python scripts/check_release_candidate.py \
            --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" --needs-json "$CHECK_RESULTS" \
            --required-check validate-version --required-check full-checks \
            --required-check audit-wheels --required-check linux-wheel-smoke \
            --required-check macos-wheel-smoke --required-check windows-wheel-smoke \
            --required-check sdist-smoke --evidence-sha "$QUALITY_SHA" \
            --evidence-sha "$SDIST_SHA" --receipt release-evidence.json

      - name: Retain release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - release-gate
    environment: pypi
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.candidate-sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: >-
          python scripts/check_release_candidate.py
          --candidate-sha "$CANDIDATE_SHA" --expected-sha "$GITHUB_SHA"
          --checkout-sha "$(git rev-parse HEAD)"

      - name: Download release wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download verified source archive
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Download source archive identity
        uses: actions/download-artifact@v4
        with:
          name: sdist-provenance
          path: evidence

      - name: Verify source archive before publication
        shell: python
        env:
          CANDIDATE_SHA: ${{ needs.validate-version.outputs.candidate-sha }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("evidence/sdist-provenance.json").read_text())
          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit("expected exactly one verified source archive")
          archive = archives[0]
          expected = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
          }
          if manifest != expected:
              raise SystemExit("source archive does not match the verified candidate")

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
